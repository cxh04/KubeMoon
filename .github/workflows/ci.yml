name: MoonBit CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  native:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install stable MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s 0.10.14+7d59c7ec9
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Show toolchain
        run: moon version --all
      - name: Resolve dependencies
        run: moon update
      - name: Format
        run: moon fmt --check
      - name: Check without warnings
        run: moon check --target native --deny-warn --warn-list +73
      - name: Test native target
        run: moon test --target native
      - name: Check release file list
        shell: bash
        run: |
          files="$(moon package --list)"
          if printf '%s\n' "$files" | grep -E '(^|[/\\])superpowers([/\\]|$)|项目申报书|~\$'; then
            echo 'Release contains private or internal files' >&2
            exit 1
          fi
      - name: Run local watch demonstration
        run: moon run examples/watch_once --target native

  kind:
    needs: native
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install stable MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s 0.10.14+7d59c7ec9
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: moon update
      - name: Install pinned kind and kubectl
        shell: bash
        run: |
          curl -fsSLo kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x kind
          sudo mv kind /usr/local/bin/kind
          curl -fsSLo kubectl https://dl.k8s.io/release/v1.37.0/bin/linux/amd64/kubectl
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/kubectl
          kind version
          kubectl version --client
      - name: ConfigMirror lifecycle in kind
        shell: bash
        run: bash tests/kind-e2e.sh
