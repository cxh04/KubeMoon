apiVersion: v1
kind: Namespace
metadata:
  name: kubemoon-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubemoon-configmirror
  namespace: kubemoon-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubemoon-configmirror
rules:
  - apiGroups: ["kubemoon.cxh04.github.io"]
    resources: ["configmirrors"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["kubemoon.cxh04.github.io"]
    resources: ["configmirrors/status"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubemoon-configmirror
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubemoon-configmirror
subjects:
  - kind: ServiceAccount
    name: kubemoon-configmirror
    namespace: kubemoon-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubemoon-configmirror
  namespace: kubemoon-system
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: kubemoon-configmirror
  template:
    metadata:
      labels:
        app: kubemoon-configmirror
    spec:
      serviceAccountName: kubemoon-configmirror
      containers:
        - name: controller
          image: kubemoon-configmirror:e2e
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
